advisor:
  base_url: https://api.openai.com/v1
  base_url_env: OPENAI_BASE_URL
  model: gpt-5.4-mini
  api_key_env: OPENAI_API_KEY
  max_completion_tokens: 200
  temperature: 0.0
  max_concurrency: 20
  max_retries: 3
  timeout: 120.0
  trust_env: true
  extra_payload:
    reasoning_effort: none
repair:
  base_url: http://127.0.0.1:8999
  base_url_env: LOCAL_VLLM_BASE_URL
  model: mix_lora
  max_tokens: 2048
  temperature: 0.0
  max_concurrency: 30
  max_retries: 3
  timeout: 300.0
  trust_env: false
  extra_payload:
    top_k: 20
    chat_template_kwargs:
      enable_thinking: false
